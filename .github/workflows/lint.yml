name: Go

on: [ push ]

jobs:
    gobuild:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/setup-go@v6
                with:
                    go-version: 1.25
            -   uses: actions/checkout@v6
            -   name: go build
                run: go build -v ./...

    gotest:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/setup-go@v6
                with:
                    go-version: 1.25
            -   uses: actions/checkout@v6
            -   name: go build
                run: go test -v ./...

    golangci:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/setup-go@v6
                with:
                    go-version: 1.25
            -   uses: actions/checkout@v6
            -   name: golangci-lint
                uses: golangci/golangci-lint-action@v9
                with:
                    version: latest
